name: Build & Deploy QuickTable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. Build & Push Backend Docker Image (Runs on GitHub Free Cloud)
  build-backend:
    name: Build Backend Image (.NET)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./QuickTable.API
          file: ./QuickTable.API/Dockerfile
          push: true
          tags: ghcr.io/raaa-dev/quicktable-api:latest

  # 2. Build & Push Frontend Docker Image (Runs on GitHub Free Cloud)
  build-frontend:
    name: Build Frontend Image (Vue/Nginx)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./QuickTable.Web
          file: ./QuickTable.Web/Dockerfile
          push: true
          tags: ghcr.io/raaa-dev/quicktable-web:latest

  # 3. Deploy directly on VM using the Self-Hosted Runner (Zero SSH needed!)
  deploy-to-vm:
    name: Deploy to VM Server
    needs: [build-backend, build-frontend]
    runs-on: self-hosted

    steps:
      - name: Pull Latest Images & Restart Containers
        run: |
          cd ~/quicktable
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d
          docker image prune -f
