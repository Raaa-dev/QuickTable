version: "3.8"

services:
  # 1. PostgreSQL Database
  postgres_db:
    image: postgres:16-alpine
    container_name: quicktable_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quicktable}
      POSTGRES_USER: ${POSTGRES_USER:-quicktable_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourStrongPassword123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - quicktable-net

  # 2. .NET 8 Backend API
  backend:
    image: ghcr.io/raaa-dev/quicktable-api:latest
    container_name: quicktable_api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres_db
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-quicktable};Username=${POSTGRES_USER:-quicktable_user};Password=${POSTGRES_PASSWORD:-YourStrongPassword123!}
      - Jwt__Key=${JWT_KEY:-your-super-secret-key-at-least-32-chars!!}
      - Jwt__Issuer=QuickTableAPI
      - Jwt__Audience=QuickTableClient
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
      - Cloudinary__CloudName=${CLOUDINARY_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_SECRET}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - quicktable-net

  # 3. Vue Frontend + Nginx Reverse Proxy
  frontend:
    image: ghcr.io/raaa-dev/quicktable-web:latest
    container_name: quicktable_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quicktable-net

volumes:
  pgdata:
    driver: local
  backend_uploads:
    driver: local

networks:
  quicktable-net:
    driver: bridge
